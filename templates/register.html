{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Create Account</h1>

    <form method="POST">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <input type="text"
               name="name"
               placeholder="Full Name"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="tel"
               name="phone"
               placeholder="Phone Number"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               minlength="8"
               required>

        <label class="check">

            <input type="checkbox"
                   name="sms_enabled"
                   value="yes">

            I consent to emergency SMS notifications
            being sent to my saved trusted contacts.

        </label>

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
    </p>

</div>

{% endblock %}
