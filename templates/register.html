{% extends "base.html" %}

{% block content %}

<div class="glass-container">

    <div class="auth-header">
        <div class="auth-header-icon">&#128100;</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join SheGuard AI to protect yourself and your loved ones</p>
    </div>

    <form method="POST">
        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <div class="form-group">
            <label class="glass-label">Full Name</label>
            <div class="glass-input-wrapper">
                <span class="glass-input-icon">&#128100;</span>
                <input type="text"
                       name="name"
                       class="glass-input"
                       placeholder="e.g. Priya Sharma"
                       required
                       autocomplete="name">
            </div>
        </div>

        <div class="form-group">
            <label class="glass-label">Email Address</label>
            <div class="glass-input-wrapper">
                <span class="glass-input-icon">&#9993;</span>
                <input type="email"
                       name="email"
                       class="glass-input"
                       placeholder="priya@example.com"
                       required
                       autocomplete="email">
            </div>
        </div>

        <div class="form-group">
            <label class="glass-label">Phone Number</label>
            <div class="glass-input-wrapper">
                <span class="glass-input-icon">&#128222;</span>
                <input type="tel"
                       name="phone"
                       class="glass-input"
                       placeholder="+919876543210"
                       required
                       autocomplete="tel">
            </div>
        </div>

        <div class="form-group">
            <label class="glass-label">Password (Min. 8 characters)</label>
            <div class="glass-input-wrapper">
                <span class="glass-input-icon">&#128274;</span>
                <input type="password"
                       name="password"
                       class="glass-input"
                       placeholder="Create a strong password"
                       minlength="8"
                       required
                       autocomplete="new-password">
            </div>
        </div>

        <label class="glass-checkbox-label">
            <input type="checkbox"
                   name="sms_enabled"
                   value="yes"
                   checked>
            <span>
                I consent to automated emergency SMS broadcasts with my live GPS location being sent to my trusted contacts during an SOS event.
            </span>
        </label>

        <button type="submit" class="glass-btn" style="margin-top: 10px;">
            Create My Account &rarr;
        </button>

    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--glass-border);">
        <p style="color: var(--text-secondary); font-size: 14px;">
            Already have an account?
            <a href="{{ url_for('login') }}" class="glass-link">
                Sign in here
            </a>
        </p>
    </div>

</div>

{% endblock %}
