<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHEGUARD AI - Intelligent Safety Guardian</title>

    <meta name="csrf-token" content="{{ csrf_token() }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="glass-nav">
    <a href="{{ url_for('home') }}" class="brand-wrapper">
        <div class="brand-icon-shield">&#128737;</div>
        <div class="brand-title">SHEGUARD</div>
        <span class="brand-ai-tag">AI</span>
    </a>

    <div class="nav-links">
        {% if session.get('user_id') %}
            <a href="{{ url_for('dashboard') }}" class="nav-pill">
                <span>&#128202;</span> Dashboard
            </a>
            <a href="{{ url_for('contacts') }}" class="nav-pill">
                <span>&#128101;</span> Contacts
            </a>
            <form method="POST" action="{{ url_for('logout') }}" style="margin: 0; display: inline;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="nav-pill nav-pill-logout">
                    <span>&#8618;</span> Logout
                </button>
            </form>
        {% else %}
            <a href="{{ url_for('login') }}" class="nav-pill">Sign In</a>
            <a href="{{ url_for('register') }}" class="nav-pill nav-pill-logout" style="background: rgba(236,72,153,0.18); border-color: rgba(236,72,153,0.4); color: #f472b6;">
                Get Started
            </a>
        {% endif %}
    </div>
</nav>

<main>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="glass-messages-wrapper">
                {% for message in messages %}
                    <div class="glass-message">
                        <span>&#10004; {{ message }}</span>
                        <span style="cursor: pointer; opacity: 0.7; font-size: 18px;" onclick="this.parentElement.remove()">&times;</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
